<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Калькулятор стоимости выезда на монтаж — Яндекс.Карты</title>
  <style>
    :root { --bg:#0b1220; --panel:#101a30; --line:#223355; --ink:#e7efff; --muted:#9bb0d8; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto; margin:0; background:var(--bg); color:var(--ink); }
    .wrap { display:grid; grid-template-columns: 520px 1fr; height:100vh; }
    .panel { background:var(--panel); padding:16px; display:flex; flex-direction:column; gap:12px; border-right:1px solid var(--line); }
    input,button { padding:12px; border-radius:10px; border:1px solid var(--line); background:#0b1428; color:#fff; }
    button { background:#5aa2ff; border:none; cursor:pointer; font-weight:600; }
    .map { height:100%; }
    .file { padding:10px; border:1px dashed #29406f; border-radius:8px; background:#0b1428; color:#cdddff; }
    .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#112247; border:1px solid #24407b; color:#cdddff; font-size:12px; }
    .hint { font-size:12px; color:var(--muted); }
    .section { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }

    /* === Кастомный список подсказок (макс. похож на Yandex) === */
    .s-wrap { position:relative; }
    .s-list { position:absolute; inset:auto 0 0 0; top:100%; margin-top:6px; background:#0b1428; border:1px solid var(--line); border-radius:12px; box-shadow:0 6px 26px rgba(0,0,0,.4); display:none; max-height:340px; overflow:auto; z-index:100000; }
    .s-group { padding:8px 0; }
    .s-header { font-size:12px; color:var(--muted); padding:6px 12px; border-bottom:1px solid rgba(255,255,255,0.06); }
    .s-item { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; cursor:pointer; }
    .s-item:hover, .s-item.active { background:#142448; }
    .s-ic { width:18px; height:18px; border-radius:4px; background:#3a6bdc; flex:0 0 18px; margin-top:2px; position:relative; }
    .s-ic::after{ content:""; position:absolute; inset:4px; background:#fff; border-radius:2px; }
    .s-title { font-size:14px; line-height:1.25; }
    .s-sub { font-size:12px; color:var(--muted); margin-top:2px; }
    .s-empty { padding:10px 12px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="panel">
      <h2>Калькулятор выезда (Яндекс.Карты)</h2>

      <label>Адрес</label>
      <div class="s-wrap">
        <input id="address" type="text" placeholder="Начните вводить адрес..." autocomplete="off" style="width:100%;" />
        <div id="sList" class="s-list"></div>
      </div>
      <button id="btnFind" style="width:100%;">Найти</button>

      <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input id=\"toggleZones\" type=\"checkbox\" checked /> Показать зоны <span id=\"zonesCount\" class=\"hint\" style=\"margin-left:6px\">(—)</span>
        </label>
      </div>

      <label style="margin-top:6px;">Импорт зон (GeoJSON)</label>
      <div id="zonesUploadRow" style="display:none; gap:8px;">
        <input id="zonesFile" class="file" type="file" accept=".json,.geojson" style="flex:1;" />
        <button id="btnLoadZones" style="flex:0 0 auto;">Загрузить</button>
      </div>
      <div class="hint">FeatureCollection с полигонами. Свойства: <b>name</b>, <b>price</b> (₽), опционально <b>priority</b>. Зоны скрыты по умолчанию.</div>

      <div id="result" style="margin-top:6px; display:grid; gap:6px;">
        <div class="badge" id="zoneBadge">Зона: —</div>
        <div>Стоимость: <b id="price">—</b></div>
        <div class="hint" id="coords">Координаты: —</div>
        <div class="hint" id="region">Регион: —</div>
      </div>

      <div class="section">
        <b>Диагностика</b>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
          <button id="btnTestSuggest">Тест подсказок: «Крыленко»</button>
          <button id="btnTestGeocode">Тест геокода: «Санкт-Петербург, ул. Крыленко, 45к1»</button>
          <button id="btnTestPrice">Тест цены (центр карты)</button>
        </div>
        <div id="diag" class="hint"></div>
      </div>

    </aside>
    <main class="map" id="map"></main>
  </div>

  <!-- ПОДКЛЮЧАЕМ Яндекс.Карты (SuggestView убран из SDK, используем ymaps.suggest) -->
  <script id="yaScript" src="https://api-maps.yandex.ru/2.1/?apikey=9d1fc9c0-62a5-46bb-b90d-4001a9ec9b9e&lang=ru_RU&load=package.full" crossorigin="anonymous" onerror="window.__yaLoadFailed&&window.__yaLoadFailed(event)"></script>
  <script>
    'use strict';

    window.__yaLoadFailed = function(){ alert('Не удалось загрузить Яндекс.Карты'); };

    const SPB_CENTER = [59.9386, 30.3141];
    let map, placemark, zonesLayer = null;

    // ===== ВШИТЫЕ ЗОНЫ (пример, замените своими) =====
    // В GeoJSON порядок координат [lng, lat]!
    const EMBEDDED_ZONES = {"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"name": "1", "price": 2500, "priority": 2}, "geometry": {"type": "Polygon", "coordinates": [[[30.434875488281254, 59.824771939113615], [30.428009033203125, 59.82493405730046], [30.420112609863285, 59.83327000665599], [30.427322387695316, 59.83824427001129], [30.43693542480469, 59.8363585149167], [30.43693542480469, 59.8282762630088], [30.434875488281254, 59.824771939113615]]]}}, {"type": "Feature", "properties": {"name": "2", "price": 4500, "priority": 2}, "geometry": {"type": "Polygon", "coordinates": [[[30.30509948730469, 60.01068880268246], [30.292739868164066, 60.01044693070276], [30.287246704101566, 60.01389324062302], [30.28312683105469, 60.01623387219478], [30.285530090332035, 60.02040431581986], [30.29136657714844, 60.01995860186258], [30.299263000488285, 60.01643617210375], [30.304756164550785, 60.01421655342424], [30.3057861328125, 60.01340733066829], [30.30509948730469, 60.01068880268246]]]}}, {"type": "Feature", "properties": {"name": "3", "price": 6500, "priority": 2}, "geometry": {"type": "Polygon", "coordinates": [[[30.7489013671875, 59.834680742060404], [30.740318298339847, 59.8311523770445], [30.73551177978516, 59.832562914296156], [30.726928710937504, 59.8366835867436], [30.734138488769535, 59.84005077943086], [30.74546813964844, 59.83907955398156], [30.75027465820313, 59.83915939483527], [30.754394531250004, 59.83996702029976], [30.75714111328125, 59.83708511409474], [30.75645446777344, 59.83459795183881], [30.7489013671875, 59.834680742060404]]]}}, {"type": "Feature", "properties": {"name": "4", "price": 8000, "priority": 2}, "geometry": {"type": "Polygon", "coordinates": [[[30.077972412109378, 59.916541454853576], [30.064582824707035, 59.91966890144712], [30.060806274414066, 59.916463143526134], [30.057373046875, 59.91614156721183], [30.051536560058597, 59.91894062078374], [30.053939819335938, 59.92021887354852], [30.053596496582035, 59.92410671805061], [30.062180519104008, 59.92378890898175], [30.067501068115238, 59.92410477533985], [30.074024200439457, 59.92070557143054], [30.077972412109378, 59.916541454853576]]]}}]} ;

    let zonesFC = EMBEDDED_ZONES; // стартуем с вшитыми; можно переопределить из LS
    function loadZonesFromLS(){ try{ const raw = localStorage.getItem('zonesGeoJSON'); if (raw) zonesFC = JSON.parse(raw); }catch(e){} }
    function saveZonesToLS(fc){ try{ localStorage.setItem('zonesGeoJSON', JSON.stringify(fc)); }catch(e){} }

    // ===== Геометрия/утилиты =====
    const ringLngLatToLatLng = r => r.map(pt=>[pt[1], pt[0]]);
    function pointInPolygon(point, ring){ const x=point[1], y=point[0]; let inside=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const xi=ring[i][1], yi=ring[i][0]; const xj=ring[j][1], yj=ring[j][0]; const denom=(yj-yi)||1e-9; const cross=((yi>y)!=(yj>y)) && (x < (xj-xi)*(y-yi)/denom + xi); if(cross) inside=!inside; } return inside; }
    function mercatorXY(lat,lng){ const R=6378137; const x=R*lng*Math.PI/180; const y=R*Math.log(Math.tan(Math.PI/4 + (lat*Math.PI/180)/2)); return [x,y]; }
    function polygonAreaLatLngRing(ring){ const pts=ring.map(p=>mercatorXY(p[0],p[1])); let a=0; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [x1,y1]=pts[j]; const [x2,y2]=pts[i]; a += (x1*y2 - x2*y1); } return Math.abs(a)/2; }

    function showResult({name='—', price='—', latlng=null}){
      document.getElementById('zoneBadge').textContent = 'Зона: ' + name;
      document.getElementById('price').textContent = price==='—' ? '—' : (Number(price).toLocaleString('ru-RU') + ' ₽');
      document.getElementById('coords').textContent = latlng ? (`Координаты: ${latlng[0].toFixed(6)}, ${latlng[1].toFixed(6)}`) : 'Координаты: —';
    }

    function calcPrice(latlng){
      const candidates=[];
      for(const f of zonesFC.features){ if(!f||!f.geometry) continue; if(f.geometry.type==='Polygon'){ const ring=ringLngLatToLatLng(f.geometry.coordinates[0]); if(pointInPolygon(latlng, ring)){ const area=polygonAreaLatLngRing(ring); const priceNum=Number((f.properties||{}).price); const priority=Number((f.properties||{}).priority||0); candidates.push({f,area,priceNum:isFinite(priceNum)?priceNum:null,priority}); } } else if(f.geometry.type==='MultiPolygon'){ for(const poly of f.geometry.coordinates){ const ring=ringLngLatToLatLng(poly[0]); if(pointInPolygon(latlng, ring)){ const area=polygonAreaLatLngRing(ring); const priceNum=Number((f.properties||{}).price); const priority=Number((f.properties||{}).priority||0); candidates.push({f,area,priceNum:isFinite(priceNum)?priceNum:null,priority}); break; } } } }
      if(candidates.length){ candidates.sort((a,b)=>{ if(b.priority!==a.priority) return b.priority-a.priority; const ap=a.priceNum??-Infinity, bp=b.priceNum??-Infinity; if(bp!==ap) return bp-ap; return a.area-b.area; }); const best=candidates[0].f; const {name,price}=best.properties||{}; showResult({name:name||'Без имени', price:price??'—', latlng}); } else { showResult({name:'Вне зон', price:'—', latlng}); }
    }

    function setRegionFromObj(obj){ try{ const gm=obj.properties.get('metaDataProperty').GeocoderMetaData; const text=(gm&&gm.text)||''; const isLO=/ленинградская область/i.test(text); document.getElementById('region').textContent='Регион: ' + (isLO?'Ленинградская область':'Санкт-Петербург/другой'); }catch(e){} }

    // ===== Карта, ввод, подсказки =====
    let sTimer=null, sIndex=-1, sItems=[];
    function init(){
      map = new ymaps.Map('map', { center: SPB_CENTER, zoom: 11, controls:['zoomControl','typeSelector','geolocationControl','fullscreenControl'] }, { suppressMapOpenBlock:true });

      const input = document.getElementById('address');
      input.addEventListener('input', onAddressInput);
      input.addEventListener('keydown', onAddressKey);
      document.addEventListener('click', (e)=>{ const l=document.getElementById('sList'); if (!l.contains(e.target) && e.target!==input) hideSuggest(); });

      document.getElementById('btnFind').onclick = ()=>{ const q=input.value.trim(); if(q) findAndMark(q); };
      document.getElementById('btnTestSuggest').onclick = ()=>{ input.value='Крыленко'; input.focus(); input.dispatchEvent(new Event('input', {bubbles:true})); };
      document.getElementById('btnTestGeocode').onclick = ()=> findAndMark('Санкт-Петербург, улица Крыленко, 45к1');
      document.getElementById('btnTestPrice').onclick = ()=>{ const c=map.getCenter(); calcPrice([c[0], c[1]]); };

      const toggle = document.getElementById('toggleZones');
      const uploadRow = document.getElementById('zonesUploadRow');
      toggle.addEventListener('change', ()=>{
        uploadRow.style.display = toggle.checked ? 'flex' : 'none';
        if (toggle.checked) showZones(); else hideZones();
      });

      map.events.add('click', e=>{ const coord=e.get('coords'); placeMarker(coord, {reverse:true}); });

      loadZonesFromLS();
      // Показать зоны сразу, если тумблер включён
      if (toggle.checked) { showZones(); uploadRow.style.display='flex'; }
    }

    function onAddressInput(){
      const q = document.getElementById('address').value.trim();
      if (sTimer) { clearTimeout(sTimer); sTimer=null; }
      if (q.length < 3) { hideSuggest(); return; }
      sTimer = setTimeout(()=>{ doSuggest(q).then(renderSuggest).catch(()=> hideSuggest()); }, 200);
    }

    function onAddressKey(e){
      const list=document.getElementById('sList');
      const listOpen = list.style.display==='block';
      if (listOpen){
        if(e.key==='ArrowDown'){ e.preventDefault(); sIndex=Math.min(sIndex+1, sItems.length-1); highlightSuggest(); return; }
        if(e.key==='ArrowUp'){ e.preventDefault(); sIndex=Math.max(sIndex-1, 0); highlightSuggest(); return; }
        if(e.key==='Enter'){ e.preventDefault(); if(sItems[sIndex]) { selectSuggest(sItems[sIndex]); return; } }
        if(e.key==='Escape'){ hideSuggest(); return; }
      }
      if(e.key==='Enter'){ e.preventDefault(); const q=document.getElementById('address').value.trim(); if(q) findAndMark(q); }
    }

    function highlight(s, q){ try{ const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i'); return s.replace(re, m=>`<b>${m}</b>`); }catch(e){ return s; } }
    function splitValue(val){ const parts = val.split(',').map(s=>s.trim()); return { title: parts[0]||val, sub: parts.slice(1).join(', ') }; }

    function doSuggest(q){
      return new Promise((resolve,reject)=>{
        try{
          const yaScript=document.getElementById('yaScript');
          const key=new URL(yaScript.src).searchParams.get('apikey')||'';
          const b=map&&map.getBounds?map.getBounds():null; // [[lat,lon],[lat,lon]]
          const bbox=b?`${b[0][1]},${b[0][0]}~${b[1][1]},${b[1][0]}`:'';
          const url=`https://suggest-maps.yandex.ru/v1/suggest?text=${encodeURIComponent(q)}&lang=ru_RU${bbox?`&bbox=${bbox}`:''}&apikey=${encodeURIComponent(key)}&types=geo,street,house`;
          fetch(url).then(r=>r.ok?r.json():Promise.reject(r)).then(data=>{
            const raw = data.results || data.suggestions || data.items || [];
            const items = raw.map(it=>{
              const t = (it.title && (it.title.text||it.title.display||it.title)) || it.text || it.name || '';
              const s = (it.subtitle && (it.subtitle.text||it.subtitle.display||it.subtitle)) || it.description || '';
              const value = s ? `${t}, ${s}` : t;
              return { value };
            });
            if(items.length) return resolve(items);
            // если внезапно пусто — резерв на ymaps.suggest
            if (typeof ymaps!=='undefined' && ymaps.suggest) {
              ymaps.suggest(q).then(arr=> resolve((arr||[]).map(x=>({value:x.value}))) ).catch(reject);
            } else reject('no suggest');
          }).catch(()=>{
            if (typeof ymaps!=='undefined' && ymaps.suggest) {
              ymaps.suggest(q).then(arr=> resolve((arr||[]).map(x=>({value:x.value}))) ).catch(reject);
            } else reject('no suggest');
          });
        }catch(e){ reject(e); }
      });
    }

    function renderSuggest(items){ const list=document.getElementById('sList'); sItems=items.slice(0,10); list.innerHTML=''; sIndex=-1; if(!sItems.length){ const d=document.createElement('div'); d.className='s-empty'; d.textContent='Нет вариантов'; list.appendChild(d);} else { const grp=document.createElement('div'); grp.className='s-group'; const head=document.createElement('div'); head.className='s-header'; head.textContent='Подсказки'; grp.appendChild(head); sItems.forEach((it)=>{ const d=document.createElement('div'); d.className='s-item'; const ic=document.createElement('div'); ic.className='s-ic'; const text=document.createElement('div'); const {title, sub}=splitValue(it.value); text.innerHTML=`<div class="s-title">${highlight(title, document.getElementById('address').value.trim())}</div>` + (sub?`<div class="s-sub">${sub}</div>`:''); d.appendChild(ic); d.appendChild(text); d.onmousedown=(ev)=>{ ev.preventDefault(); selectSuggest(it); }; grp.appendChild(d); }); list.appendChild(grp);} list.style.display='block'; }
    function highlightSuggest(){ const list=document.getElementById('sList'); Array.from(list.querySelectorAll('.s-item')).forEach((el,i)=>el.classList.toggle('active', i===sIndex)); const active=list.querySelectorAll('.s-item')[sIndex]; if(active) active.scrollIntoView({block:'nearest'}); }
    function selectSuggest(item){ const input=document.getElementById('address'); input.value=item.value; hideSuggest(); findAndMark(item.value); }
    function hideSuggest(){ const l=document.getElementById('sList'); l.style.display='none'; l.innerHTML=''; sItems=[]; sIndex=-1; }

    // Флаг: использовать ли HTTP Геокодер (требуется отдельный ключ/права). По умолчанию отключён.
    const USE_HTTP_GEOCODER = false;

    function findAndMark(query){
      const opts = { results:1, boundedBy: map.getBounds(), strictBounds: true, kind:'house' };
      ymaps.geocode(query, opts).then(res=>{
        const obj=res.geoObjects.get(0);
        if(!obj){ alert('Адрес не найден'); return; }
        const coord=obj.geometry.getCoordinates();
        placeMarker(coord);
        map.setCenter(coord, 14, { checkZoomRange:true });
        const name=obj.getAddressLine&&obj.getAddressLine(); if(name) document.getElementById('address').value=name;
        setRegionFromObj(obj);
      }).catch(err=>{
        console.warn('ymaps.geocode error:', err);
        if (!USE_HTTP_GEOCODER) { alert('Геокодер недоступен. Проверьте ключ/ограничения реферера.'); return; }
        // --- НЕ ИСПОЛЬЗУЕТСЯ по умолчанию: HTTP Геокодер требует отдельные права ---
        try{
          const yaScript = document.getElementById('yaScript');
          const apiKey = new URL(yaScript.src).searchParams.get('apikey') || '';
          if(!apiKey) throw new Error('no api key');
          const url = 'https://geocode-maps.yandex.ru/1.x/?format=json&apikey='+encodeURIComponent(apiKey)+'&lang=ru_RU&geocode='+encodeURIComponent(query);
          fetch(url).then(r=>r.ok?r.json():Promise.reject(r)).then(data=>{
            const member = data.response.GeoObjectCollection.featureMember[0];
            if(!member) throw new Error('empty');
            const pos = member.GeoObject.Point.pos.split(' ').map(Number); // [lon, lat]
            const coord = [pos[1], pos[0]];
            placeMarker(coord);
            map.setCenter(coord, 14, { checkZoomRange:true });
            const text = member.GeoObject.metaDataProperty.GeocoderMetaData.text;
            if(text) document.getElementById('address').value = text;
            document.getElementById('region').textContent = /ленинградская область/i.test(text)? 'Регион: Ленинградская область' : 'Регион: Санкт-Петербург/другой';
          }).catch(()=>{ alert('HTTP Геокодер вернул ошибку (возможно 403). Он требует отдельный ключ/права.'); });
        }catch(e){ alert('Геокодер недоступен. Проверьте ключ/интернет.'); }
      });
    }
    function placeMarker(coord, opts={}){ if(!placemark){ placemark=new ymaps.Placemark(coord, {}, {preset:'islands#blueIcon'}); map.geoObjects.add(placemark);} else placemark.geometry.setCoordinates(coord); calcPrice([coord[0], coord[1]]); if(opts.reverse){ ymaps.geocode(coord, { kind:'house', results:1 }).then(res=>{ const obj=res.geoObjects.get(0); if(!obj) return; const name=obj.getAddressLine&&obj.getAddressLine(); if(name) document.getElementById('address').value=name; setRegionFromObj(obj); }); } }

    // ===== Показ/скрытие зон на карте =====
    function swapLngLatToLatLngCoords(coords){ // GeoJSON -> Yandex (lat,lon)
      return coords.map(ring => ring.map(pt => [pt[1], pt[0]]));
    }
    function showZones(){
      hideZones();
      zonesLayer = new ymaps.GeoObjectCollection(null, { fillColor:'#2a6df0AA', strokeColor:'#2a6df0', strokeOpacity:0.8, strokeWidth:2 });
      let cnt=0;
      for (const f of (zonesFC.features||[])){
        if(!f.geometry) continue;
        if(f.geometry.type==='Polygon'){
          const coords = swapLngLatToLatLngCoords(f.geometry.coordinates[0]);
          const poly = new ymaps.Polygon([coords], { hintContent: (f.properties?.name||'Зона')+ (f.properties?.price!=null?` — ${f.properties.price} ₽`:'' ) }, {});
          zonesLayer.add(poly); cnt++;
        } else if(f.geometry.type==='MultiPolygon'){
          for(const c of f.geometry.coordinates){
            const coords = swapLngLatToLatLngCoords(c[0]);
            const poly=new ymaps.Polygon([coords], { hintContent:(f.properties?.name||'Зона')+ (f.properties?.price!=null?` — ${f.properties.price} ₽`:'' ) }, {});
            zonesLayer.add(poly); cnt++;
          }
        }
      }
      map.geoObjects.add(zonesLayer);
      document.getElementById('zonesCount').textContent = `(${cnt} зон)`;
    }
    function hideZones(){ if(zonesLayer){ map.geoObjects.remove(zonesLayer); zonesLayer=null; } document.getElementById('zonesCount').textContent='(—)'; }

    function loadZones(){ const file=document.getElementById('zonesFile').files[0]; if(!file) return alert('Выберите файл'); const reader=new FileReader(); reader.onload=()=>{ try{ const fc=JSON.parse(reader.result); if(!fc||fc.type!=='FeatureCollection') throw new Error('Нужен FeatureCollection'); saveZonesToLS(fc); zonesFC=fc; if(document.getElementById('toggleZones').checked){ showZones(); } alert('Зоны загружены'); }catch(e){ alert('Ошибка файла: '+e.message); } }; reader.readAsText(file); }

    (function wait(){ if(window.ymaps&&ymaps.ready) ymaps.ready(init); else setTimeout(wait, 300); })();
  </script>
</body>
</html>
